<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Reviews | Iron Trail Welding | Gatesville, TX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="Read real customer reviews for Iron Trail Welding in Gatesville, TX and leave your own feedback about our mobile welding and fabrication services." />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #333 0, #050505 55%);
      color: #f5f5f5;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header / Nav */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.95);
      border-bottom: 1px solid #333;
      backdrop-filter: blur(6px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .brand span.accent {
      color: #ffb400;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
    }

    nav a {
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
    }

    nav a:hover,
    nav a.active {
      border-color: #ffb400;
    }

    /* Layout */
    main {
      flex: 1;
    }

    .page-wrap {
      max-width: 1100px;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .subtitle {
      color: #cccccc;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 1.75rem;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 3fr 2fr;
        align-items: flex-start;
      }
    }

    /* Reviews */
    #reviews-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .review-card {
      background: rgba(8, 8, 8, 0.95);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      border-left: 4px solid #ffb400;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .review-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .review-meta {
      font-size: 0.8rem;
      color: #aaaaaa;
    }

    .stars {
      font-size: 0.9rem;
      color: #ffb400;
      white-space: nowrap;
    }

    .review-text {
      font-size: 0.95rem;
      color: #f0f0f0;
      margin-top: 0.25rem;
      word-wrap: break-word;
    }

    .empty-state {
      font-size: 0.9rem;
      color: #aaaaaa;
      padding: 1rem;
      border-radius: 8px;
      border: 1px dashed #444;
      text-align: center;
    }

    /* Form */
    .form-card {
      background: rgba(8, 8, 8, 0.95);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #222;
    }

    .form-card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .form-card p.small {
      font-size: 0.8rem;
      color: #bbbbbb;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      color: #dddddd;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #151515;
      color: #ffffff;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      max-height: 200px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
      cursor: pointer;
      background: linear-gradient(120deg, #ffb400, #ff7a00);
      color: #000;
      margin-top: 0.25rem;
    }

    footer {
      border-top: 1px solid #222;
      font-size: 0.8rem;
      color: #888;
      padding: 1rem;
      text-align: center;
      background: #050505;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="accent">Iron Trail</span> Welding
      </a>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="reviews.html" class="active">Reviews</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrap">
      <h1>Customer Reviews</h1>
      <p class="subtitle">
        Real feedback from customers we’ve helped in Gatesville and the surrounding areas.
      </p>

      <div class="grid">
        <section aria-label="Customer reviews">
          <div id="reviews-list">
            <div class="empty-state" id="empty-state">
              No reviews yet — be the first to leave one!
            </div>
          </div>
        </section>

        <aside>
          <div class="form-card">
            <h2>Leave a Review</h2>
            <p class="small">Tell us how we did.</p>

            <form id="review-form">
              <label>Your Name (optional)</label>
              <input type="text" id="name" placeholder="John S.">

              <label>Rating</label>
              <select id="rating">
                <option value="5" selected>★★★★★ – 5 / 5</option>
                <option value="4">★★★★☆ – 4 / 5</option>
                <option value="3">★★★☆☆ – 3 / 5</option>
                <option value="2">★★☆☆☆ – 2 / 5</option>
                <option value="1">★☆☆☆☆ – 1 / 5</option>
              </select>

              <label>Your Review</label>
              <textarea id="review" required></textarea>

              <button type="submit">Submit Review</button>
              <div id="form-status" class="form-status"></div>
            </form>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> Iron Trail Welding. Gatesville, TX.
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* --- YOUR FIREBASE CONFIG --- */
    const firebaseConfig = {
      apiKey: "AIzaSyC9ravNjrF4NlCyr1WY4bxMGP4RZd0",
      authDomain: "irontrailwelding.firebaseapp.com",
      projectId: "irontrailwelding",
      storageBucket: "irontrailwelding.firebasestorage.app",
      messagingSenderId: "815483050252",
      appId: "1:815483050252:web:7d92d2159f3101b0d7cf6a",
      measurementId: "G-4X8B6YB047"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const reviewsRef = db.collection("reviews");

    const reviewsList = document.getElementById("reviews-list");
    const emptyState = document.getElementById("empty-state");
    const form = document.getElementById("review-form");
    const status = document.getElementById("form-status");

    function stars(r) {
      return "★".repeat(r) + "☆".repeat(5 - r);
    }

    reviewsRef.orderBy("createdAt", "desc").onSnapshot(snapshot => {
      reviewsList.innerHTML = "";
      if (snapshot.empty) {
        emptyState.style.display = "block";
        reviewsList.appendChild(emptyState);
        return;
      }
      emptyState.style.display = "none";
      snapshot.forEach(doc => {
        const r = doc.data();
        const card = document.createElement("div");
        card.classList.add("review-card");
        card.innerHTML = `
          <div class="review-header">
            <div class="review-name">${r.name || "Anonymous"}</div>
            <div class="stars">${stars(r.rating)}</div>
            <div class="review-meta">${r.createdAt ? r.createdAt.toDate().toLocaleDateString() : ""}</div>
          </div>
          <p class="review-text">${r.text}</p>
        `;
        reviewsList.appendChild(card);
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Submitting...";
      const name = document.getElementById("name").value.trim() || "Anonymous";
      const rating = parseInt(document.getElementById("rating").value);
      const text = document.getElementById("review").value.trim();
      if (text.length < 5) {
        status.textContent = "Review is too short.";
        return;
      }
      await reviewsRef.add({
        name,
        rating,
        text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      form.reset();
      status.textContent = "Review submitted!";
    });
  </script>

</body>
</html>
